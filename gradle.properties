# Project SDK / Gradle JVM: full JetBrains Runtime SDK 25 (ships jpackage + jlink + javac).
org.gradle.java.home=/opt/jbrsdk-25.0.4-linux-x64-b508.27
# Make the same SDK available as a Java toolchain (used for jpackage/jlink at packaging time).
org.gradle.java.installations.paths=/opt/jbrsdk-25.0.4-linux-x64-b508.27

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
