<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Blaze" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Blaze</title>
  <defs>
    <!-- Flame silhouette (two tongues), reused for fill and facet clipping -->
    <path id="flame" d="M64 114C86 114 100 98 100 78C100 58 84 44 72 12C62 30 54 44 56 58C48 56 42 50 36 38C30 56 28 66 28 78C28 98 44 114 64 114Z"/>

    <!-- Dark JetBrains-style tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2B31"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="84" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97A12" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FE315D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FE315D" stop-opacity="0"/>
    </radialGradient>

    <!-- JetBrains palette, hot core at the bottom → cool tip at the top -->
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="64" y1="114" x2="64" y2="12">
      <stop offset="0"    stop-color="#FCF84A"/>
      <stop offset="0.30" stop-color="#F97A12"/>
      <stop offset="0.66" stop-color="#FE315D"/>
      <stop offset="1"    stop-color="#B345F1"/>
    </linearGradient>

    <clipPath id="tileClip"><rect width="128" height="128" rx="30"/></clipPath>
    <clipPath id="flameClip"><use xlink:href="#flame" href="#flame"/></clipPath>

    <!-- The download arrow is negative space cut out of the flame -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M57 62H71V82H84L64 105L44 82H57Z" fill="#000"/>
    </mask>
  </defs>

  <!-- Tile -->
  <g clip-path="url(#tileClip)">
    <rect width="128" height="128" fill="url(#tile)"/>
    <rect width="128" height="128" fill="url(#glow)"/>
  </g>

  <!-- Flame (slightly scaled for breathing room) -->
  <g transform="translate(5.12 5.12) scale(0.92)">
    <g mask="url(#cut)">
      <use xlink:href="#flame" href="#flame" fill="url(#fire)"/>
      <!-- Geometric facets for depth -->
      <g clip-path="url(#flameClip)">
        <path d="M72 12L112 92L64 122L68 70Z" fill="#fff" fill-opacity="0.14"/>
        <path d="M18 70L64 120L18 120Z" fill="#000" fill-opacity="0.12"/>
      </g>
    </g>
  </g>

  <!-- Sparks -->
  <path d="M104 30L109 35L104 40L99 35Z" fill="#FCF84A"/>
  <path d="M21 42L24.5 45.5L21 49L17.5 45.5Z" fill="#FE315D"/>
  <path d="M92 16L94.5 18.5L92 21L89.5 18.5Z" fill="#fff" fill-opacity="0.85"/>
</svg>
